<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Learning Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #141b2d;
      --card-hover: #1e293b;
      --accent: #6366f1;
      --accent-green: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      height: 100vh;
      width: 100vw;
      background-color: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 12px 20px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background-color: rgba(20, 27, 45, 0.85);
      backdrop-filter: blur(10px);
      flex-shrink: 0;
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    /* Mode Toggle Controls */
    .mode-toggle-container {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .mode-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mode-btn.active#ixlBtn {
      background: var(--accent-green);
      color: white;
      border-color: var(--accent-green);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
    }

    .mode-btn.active#ytBtn {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
    }

    /* Main Fluid Container */
    .main-container {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 16px;
      padding: 16px;
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
    }

    @media (max-width: 850px) {
      html, body {
        overflow: auto;
      }
      .main-container {
        grid-template-columns: 1fr;
        min-height: auto;
      }
    }

    /* Scrollable Sidebar */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      padding-right: 4px;
      min-height: 0;
      height: 100%;
    }

    .sidebar::-webkit-scrollbar {
      width: 5px;
    }
    .sidebar::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .unit-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .unit-title {
      padding: 12px 14px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--border);
      color: var(--accent);
      text-transform: uppercase;
      font-size: 0.78rem;
      letter-spacing: 1px;
    }

    .topic-list {
      display: flex;
      flex-direction: column;
    }

    .topic-item {
      padding: 12px 16px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
      color: var(--text);
      font-weight: 500;
      font-size: 0.88rem;
    }

    .topic-item:last-child {
      border-bottom: none;
    }

    .topic-item:hover {
      background: var(--card-hover);
    }

    .topic-item.active {
      background: var(--card-hover);
      border-left: 4px solid var(--accent);
      color: white;
    }

    .chevron {
      transition: transform 0.3s ease;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .topic-item.active .chevron {
      transform: rotate(90deg);
      color: var(--accent);
    }

    .topic-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    /* Player Viewport */
    .viewport {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
      height: 100%;
    }

    .viewport-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.2);
      flex-shrink: 0;
    }

    .viewport-title {
      font-weight: 600;
      font-size: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-right: 10px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .direct-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--accent);
      text-decoration: none;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid var(--accent);
      transition: all 0.2s ease;
    }
    .direct-link:hover {
      background: var(--accent);
      color: white;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.2);
      color: var(--accent-green);
      border: 1px solid var(--accent-green);
    }

    .badge.yt {
      background: rgba(99, 102, 241, 0.2);
      color: var(--accent);
      border-color: var(--accent);
    }

    .player-frame {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
      min-height: 0;
    }

    video, iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

    let currentMode = 'ixl';
    let selectedTopic = null;
    let hlsPlayer = null;
    const ixlPlayer = document.getElementById('ixlPlayer');
    const ytPlayer = document.getElementById('ytPlayer');

    // Automatically record playback progress
    ixlPlayer.addEventListener('timeupdate', () => {
      if (selectedTopic && currentMode === 'ixl') {
        localStorage.setItem('time_ixl_' + selectedTopic.title, ixlPlayer.currentTime);
      }
    });

    function buildSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.innerHTML = '';

      modules.forEach((mod) => {
        const card = document.createElement('div');
        card.className = 'unit-card';

        const title = document.createElement('div');
        title.className = 'unit-title';
        title.innerText = mod.unit;
        card.appendChild(title);

        const list = document.createElement('div');
        list.className = 'topic-list';

        mod.topics.forEach((top) => {
          const item = document.createElement('div');
          item.className = 'topic-item';
          item.innerHTML = `<span class="chevron">&gt;</span><span class="topic-text">${top.title}</span>`;
          item.onclick = () => selectTopic(top, item);
          list.appendChild(item);
        });

        card.appendChild(list);
        sidebar.appendChild(card);
      });
    }

    function selectTopic(topic, element) {
      document.querySelectorAll('.topic-item').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
      selectedTopic = topic;
      
      document.getElementById('currentTitle').innerText = topic.title;
      loadMedia();
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('ixlBtn').classList.toggle('active', mode === 'ixl');
      document.getElementById('ytBtn').classList.toggle('active', mode === 'youtube');
      
      const sourceBadge = document.getElementById('sourceBadge');
      sourceBadge.innerText = mode === 'ixl' ? 'IXL Video' : 'YouTube Video';
      sourceBadge.className = mode === 'ixl' ? 'badge' : 'badge yt';
      
      if (selectedTopic) {
        loadMedia();
      }
    }

    function loadMedia() {
      const placeholder = document.getElementById('placeholder');
      const ytExternalLink = document.getElementById('ytExternalLink');

      placeholder.classList.add('hidden');

      if (!selectedTopic) return;

      if (currentMode === 'ixl') {
        // Hide YouTube player
        ytPlayer.classList.add('hidden');
        ytPlayer.src = '';
        ytExternalLink.classList.add('hidden');

        // Load IXL HLS Video Stream
        ixlPlayer.classList.remove('hidden');

        if (hlsPlayer) {
          hlsPlayer.destroy();
        }

        if (Hls.isSupported()) {
          hlsPlayer = new Hls();
          hlsPlayer.loadSource(selectedTopic.ixl);
          hlsPlayer.attachMedia(ixlPlayer);
          hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => {
            const savedTime = localStorage.getItem('time_ixl_' + selectedTopic.title);
            if (savedTime) {
              ixlPlayer.currentTime = parseFloat(savedTime);
            }
            ixlPlayer.play().catch(() => {});
          });
        } else if (ixlPlayer.canPlayType('application/vnd.apple.mpegurl')) {
          ixlPlayer.src = selectedTopic.ixl;
          const savedTime = localStorage.getItem('time_ixl_' + selectedTopic.title);
          if (savedTime) {
            ixlPlayer.currentTime = parseFloat(savedTime);
          }
          ixlPlayer.play().catch(() => {});
        }
      } else {
        // Stop IXL player
        if (hlsPlayer) {
          hlsPlayer.destroy();
          hlsPlayer = null;
        }
        ixlPlayer.pause();
        ixlPlayer.classList.add('hidden');
        ixlPlayer.removeAttribute('src');

        // Load YouTube Embed
        ytPlayer.classList.remove('hidden');
        ytPlayer.src = `https://www.youtube-nocookie.com/embed/${selectedTopic.ytId}?autoplay=1`;

        // Direct YouTube link fallback
        ytExternalLink.href = `https://www.youtube.com/watch?v=${selectedTopic.ytId}`;
        ytExternalLink.classList.remove('hidden');
      }
    }

    buildSidebar();
    
    // Auto-select first item
    const firstTopic = modules[0].topics[0];
    const firstElement = document.querySelector('.topic-item');
    if (firstTopic && firstElement) {
      selectTopic(firstTopic, firstElement);
    }
  </script>
